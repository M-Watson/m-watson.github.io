<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{ title }} | M-Watson</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1">
    <link rel="stylesheet" href="../../static/style/style.css">
    <link rel="stylesheet" href="../../static/style/navbar.css">
    <link rel="stylesheet" href="../../static/style/card.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oxygen">
    <style>
      body {
        font-family: 'Oxygen', 'avenir', sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        background-color: white; /* All white background */
        transition: background-color 0.3s, color 0.3s;
      }
      .post-container {
        background: white;
        padding: 3rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border: 1px solid #eee;
      }
      .post-header {
        border-bottom: 2px solid #eee;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .post-date {
        color: #888;
        font-size: 0.9rem;
      }
      .home-link {
        display: inline-block;
        margin-bottom: 2rem;
        text-decoration: none;
        color: #5b21b6;
        font-weight: bold;
      }
      .home-link:hover {
        text-decoration: underline;
      }
      .post-content img {
        max-width: 100%;
        height: auto;
      }

      /* Dark Mode overrides for template */
      body.dark-mode {
        background-color: #121212;
        color: #e0e0e0;
      }
      body.dark-mode .post-container {
        background-color: #1e1e1e;
        border-color: #333;
      }
      body.dark-mode .home-link {
        color: #bb86fc;
      }
    </style>
  </head>

  <body class="ma0">
    <div class="pa4">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="../../index.html" class="home-link">← Back to Home</a>
        <button onclick="toggleDarkMode()" style="cursor:pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: transparent; color: inherit; margin-bottom: 2rem;">Toggle Night Mode</button>
      </div>
      
      <main class="post-container">
        <header class="post-header">
          <div>
            <h1 class="f2 near-black mb0">{{ title }}</h1>
            <p class="post-date">Published on: {{ date }}</p>
          </div>
        </header>

        <article class="post-content">
  {{ content }}
        </article>
      </main>

      <footer class="mt5 gray">
        &copy; M-Watson 2026
      </footer>
    </div>

    <script>
      function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        localStorage.setItem("dark-mode", isDark);
      }

      if (localStorage.getItem("dark-mode") === "true") {
        document.body.classList.add("dark-mode");
      }
    </script>
  </body>
</html>
