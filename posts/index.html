<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>All Posts | M-Watson</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1">
    <link rel="stylesheet" href="../static/style/style.css">
    <link rel="stylesheet" href="../static/style/navbar.css">
    <link rel="stylesheet" href="../static/style/card.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oxygen">
    <style>
      body {
        font-family: 'Oxygen', 'avenir', sans-serif;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      .page-header {
        border-bottom: 2px solid #eee;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .home-link {
        display: inline-block;
        margin-bottom: 2rem;
        font-weight: bold;
      }
      .post-card {
        padding: 2rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        transition: 0.3s;
      }
      .post-card h2 {
        margin-top: 0;
        margin-bottom: 0.5rem;
      }
      .post-date {
        color: #888;
        font-size: 0.85rem;
      }
    </style>
    <script>
      if (localStorage.getItem("dark-mode") === "true") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
  </head>

  <body class="ma0">
    <script>
      if (localStorage.getItem("dark-mode") === "true") {
        document.body.classList.add("dark-mode");
      }
    </script>

    <button class="night-mode-toggle" onclick="toggleDarkMode()" title="Toggle Night Mode">
      <svg id="sun-icon" style="display:none" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg id="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <div style="padding: 2rem;">
      <a href="../index.html" class="home-link">← Back to Home</a>
      
      <header class="page-header">
        <h1 class="f2 near-black mb0">All Posts</h1>
      </header>

      <main id="all-posts-container">
        <p>Loading posts...</p>
      </main>

      <footer class="mt5 gray">
        &copy; M-Watson 2026
      </footer>
    </div>

    <script>
      function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        localStorage.setItem("dark-mode", isDark);
        updateIcons(isDark);
      }

      function updateIcons(isDark) {
        document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
        document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
      }

      if (localStorage.getItem("dark-mode") === "true") {
        updateIcons(true);
      }

      async function loadAllPosts() {
        const container = document.getElementById('all-posts-container');
        try {
          const response = await fetch('posts.json');
          const posts = await response.json();
          
          if (posts.length === 0) {
            container.innerHTML = '<p>No posts found.</p>';
            return;
          }

          container.innerHTML = posts.map(post => `
            <a href="../${post.path}">
              <div class="card post-card">
                <div class="container">
                  <h2>${post.title}</h2>
                  <p>${post.summary}</p>
                  <div class="post-date">${post.date}</div>
                </div>
              </div>
            </a>
          `).join('');
        } catch (error) {
          console.error('Error loading posts:', error);
          container.innerHTML = '<p>Error loading posts.</p>';
        }
      }
      loadAllPosts();
    </script>
  </body>
</html>
